[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wmh-hcy"
version = "0.1.0"
description = "CNSR-III imaging studies and archived Hcy-WMH analysis; Python only"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "statsmodels>=0.14.4,<0.15", "pyreadstat>=1.3,<2",
  "nibabel>=5.3,<6", "miceforest==6.0.5", "lightgbm==4.6.0",
  "matplotlib>=3.9,<4", "PyYAML>=6,<7", "jinja2>=3.1,<4",
  "pytest>=8,<9", "ruff>=0.12,<1"
]

[project.scripts]
wmh-hcy = "wmh_hcy.cli:main"
wmh-study = "wmh_hcy.studies.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wmh_hcy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
